[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thermofem2d"
version = "0.3.0"
description = "Parametric 2D perforated-plate thermal and thermoelastic FEM prototype"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Mehdi Soroush"}]
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
app = ["streamlit>=1.35"]

[project.scripts]
thermofem2d = "thermofem2d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
