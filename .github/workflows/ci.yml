name: Numerical verification
on:
  push:
  pull_request:
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m thermofem2d.cli --config examples/steady_plate.json --out results
      - run: python -m thermofem2d.cli --config examples/steady_plate_t6.json --out results-t6

  app-smoke:
    name: Streamlit UI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,app]"
      - run: python -m pytest -q tests/test_streamlit_app.py
